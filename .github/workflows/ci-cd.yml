name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set up PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1 # Adjust the PHP version as per your requirements
          extensions: mbstring, json, pdo, pdo_mysql
          ini-values: memory_limit=512M
          coverage: none

      # Step 3: Install Dependencies
      - name: Install Dependencies
        run: composer install --no-progress --no-suggest --prefer-dist

      # Step 4: Run Tests
      - name: Run Tests
        run: |
          phpunit --configuration phpunit.xml

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      # Step 1: Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Deploy to Server
      - name: Deploy Application
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "$SSH_PRIVATE_KEY" > deploy_key.pem
          chmod 600 deploy_key.pem
          ssh -i deploy_key.pem $DEPLOY_USER@$DEPLOY_HOST "cd $DEPLOY_PATH && git pull && php artisan migrate --force"
          rm deploy_key.pem
